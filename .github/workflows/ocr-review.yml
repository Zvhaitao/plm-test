# OpenCodeReview - PR 自动评审流水线
#
# 使用阿里巴巴开源的 open-code-review (ocr) 对 Pull Request 自动做 AI 代码评审，
# 并把结果作为行内评论 + 汇总评论贴回 PR。
#
# 需要在 仓库 Settings -> Secrets and variables -> Actions 配置：
#   Secret    OCR_LLM_URL            LLM 接口地址（Anthropic 端点需带 /v1/messages）
#   Secret    OCR_LLM_AUTH_TOKEN     LLM 鉴权 token（内部映射为 OCR_LLM_TOKEN）
#   Variable  OCR_LLM_MODEL          模型名，例如 grok-4.6
#   Variable  OCR_LLM_USE_ANTHROPIC  'true' 表示 Anthropic 格式端点，'false' 表示 OpenAI 兼容
#
# 完整的 action 输入/输出说明见 alibaba/open-code-review 仓库根目录的 action.yml。

name: OpenCodeReview PR Review

# 条件并发组：
# PR 事件 + /open-code-review 触发评论 共享 per-PR 组（新评审取消旧的）；
# 其它无关评论落到唯一的 noop-<run_id> 组，直接跳过、不打断进行中的评审。
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # 用 pull_request_target（而非 pull_request），保证来自 fork 的 PR 也能拿到 secret。
  # 这是安全的：该 action 只读取 diff，不执行 PR 中的任何代码。
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 仅在 PR 事件、或 collaborator 发出的以触发词开头的评论时运行。
    # 排除 bot 评论作为防自触发的安全网；issue_comment 进一步限制
    # 只有 MEMBER/OWNER/COLLABORATOR 才能触发（避免任意人消耗 LLM 额度）。
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            // issue_comment 事件没有顶层 pull_request 字段，
            // 这里解析出 base/head 供 action 评审正确的 diff。
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@main
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # issue_comment 触发时传入解析出的 refs；
          # pull_request_target 触发时 action 会自行从事件中解析。
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
